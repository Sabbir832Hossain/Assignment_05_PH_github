<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Github-Issue-Tracker || Login Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
  <header>
    <nav>
      <div
        class="navbar bg-base-100 shadow w-11/12 mx-auto flex flex-col md:flex-row justify-between p-5 rounded-lg space-y-4">
        <div class="flex flex-col md:flex-row justify-center items-center gap-2">
          <img class="w-[36px] h-[36px]" src="./assets/github-logo.png" alt="">
          <a class="font-bold text-2xl">Github-Issue-Tracker</a>
        </div>
        <div class="flex flex-col md:flex-row justify-center items-center gap-2">

          <input id="searchInput" type="text" placeholder="Search" class="input input-bordered w-24 md:w-auto" />


          <button id="searchBtn" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i>Find
            Issue</button>

        </div>
      </div>
    </nav>
  </header>

  <section class="w-11/12 md:w-10/12 mx-auto my-1">
    <div class="navbar bg-base-100 shadow-sm w-11/12 mx-auto flex justify-between p-9 rounded-lg">
      <div id="btn-container">
        <button onclick="activeBtn('all-btn')" id="all-btn" class="dynamicBtn btn btn-primary">All</button>
        <button onclick="activeBtn('open-btn')" id="open-btn" class="dynamicBtn btn btn-base-100">Open</button>
        <button onclick="activeBtn('close-btn')" id="close-btn" class="dynamicBtn btn btn-base-100">Closed</button>
      </div>
    </div>
  </section>

  <section class="w-11/12 md:w-10/12 mx-auto my-1">
    <div class="bg-base-100 shadow-sm w-11/12 mx-auto flex justify-between items-center p-9 rounded-lg rounded-b-none">
      <div class="">

        <div class="md:flex md:items-center gap-5">
          <div class="bg-[#ECE4FF] w-[50px] h-[50px] flex justify-center items-center p-3 rounded-full">
            <img class="w-[27px] h-[27px] object-cover" src="./assets/Aperture.png" alt="">
          </div>
          <div>
            <h3 class="font-bold text-2xl"><span id="total-issue"></span> Issues</h3>
            <p>Track and manage your project issues</p>
          </div>
        </div>

      </div>
      <div class="flex flex-col sm:flex-row justify-between items-center gap-3 ">
        <div class="flex items-center justify-center gap-2">
          <img src="./assets/Open-Status.png" alt="">
          <p>Open</p>
        </div>
        <div class="flex items-center justify-center gap-2">
          <img src="./assets/Closed- Status .png" alt="">
          <p>close</p>
        </div>

      </div>
    </div>
    <hr class="text-neutral-300 w-11/12 mx-auto">
  </section>

  <!--  -->
  <section class="w-11/12 md:w-10/12 mx-auto my-0 ">
    <div class="bg-base-100 shadow-sm w-11/12 mx-auto rounded-b-xl">
      <div id="card-container" class="grid grid-cols-1 sm:grid-cols-4 p-3 gap-3">

      </div>
      <div id="loadingSnipper" class="hidden flex justify-center items-center">
        <span class="loading loading-bars loading-xl"></span>
      </div>
      <div id="noIssue" class="flex justify-center items-center">

      </div>
    </div>
  </section>




</body>
